<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCURE - AI Health Assistant</title>
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const div = document.createElement('div');
            div.style.position = 'fixed';
            div.style.top = '0';
            div.style.left = '0';
            div.style.width = '100%';
            div.style.background = 'red';
            div.style.color = 'white';
            div.style.padding = '20px';
            div.style.zIndex = '999999';
            div.style.fontFamily = 'monospace';
            div.style.fontSize = '14px';
            div.style.whiteSpace = 'pre-wrap';
            div.innerHTML = '<strong>Uncaught Error:</strong> ' + message + '<br>at ' + source + ':' + lineno + ':' + colno;
            document.body.appendChild(div);
            return false;
        };
        window.addEventListener('unhandledrejection', function(event) {
            const div = document.createElement('div');
            div.style.position = 'fixed';
            div.style.top = '0';
            div.style.left = '0';
            div.style.width = '100%';
            div.style.background = 'orange';
            div.style.color = 'white';
            div.style.padding = '20px';
            div.style.zIndex = '999999';
            div.style.fontFamily = 'monospace';
            div.style.fontSize = '14px';
            div.style.whiteSpace = 'pre-wrap';
            div.innerHTML = '<strong>Unhandled Rejection:</strong> ' + event.reason;
            document.body.appendChild(div);
        });
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400..700;1,400..700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet.js Maps CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-brand-bg text-brand-textDark font-sans h-screen overflow-hidden relative">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
